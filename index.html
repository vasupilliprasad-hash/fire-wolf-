<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111115">
<meta name="description" content="Fire Wolf — Find Your Pack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fire Wolf — Find Your Pack</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--panel2:#23232b;--line:#34343e;--text:#f7f7fa;--muted:#a7a7b3;--orange:#ff7038;--red:#f13a32;--green:#73e6a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.app{max-width:780px;margin:auto;min-height:100dvh;border-left:1px solid #292930;border-right:1px solid #292930;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#111115f2;backdrop-filter:blur(12px);z-index:3}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px;letter-spacing:-.6px}.wolfmark{height:43px;width:43px;border-radius:14px;background:linear-gradient(145deg,#ffc54b,#ff6533 55%,#9c1f3f);display:grid;place-items:center;font-size:26px;box-shadow:0 0 20px #f54c3220}.tagline{font-size:9px;letter-spacing:1.8px;color:var(--muted)}.content{padding:17px;flex:1;min-height:65vh}.title{font-size:24px;letter-spacing:-.8px;font-weight:900;margin:3px 0 5px}.muted{color:var(--muted);font-size:12px}.section{font-weight:850;font-size:17px;margin:16px 0 10px}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.btn{border:1px solid #44444f;background:var(--panel2);padding:9px 13px;border-radius:11px}.primary{border:0;background:linear-gradient(100deg,#ff8138,#ed3b32);font-weight:800;padding:10px 15px;border-radius:11px}.duebtn{border:0;background:linear-gradient(100deg,#ff8138,#ed3b32);font-weight:800;padding:9px 13px;border-radius:10px;font-size:12px}.connected{background:#193b2a;color:#a5f4bf;border:1px solid #347b4d}.pill{display:inline-block;border-radius:30px;background:#33231e;color:#ffb28b;font-size:11px;padding:5px 9px}.avatar{height:43px;width:43px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#ffad49,#a03750);font-size:23px;border:1px solid #ff8b51}.dreams{display:flex;gap:14px;overflow:auto;padding:5px 0 14px}.dream{min-width:65px;text-align:center;font-size:11px;color:#ddd;background:none;border:0;padding:0}.ring{height:60px;width:60px;border-radius:50%;padding:3px;margin:0 auto 6px;background:linear-gradient(135deg,#ffbd41,#f22c51,#8b43ef)}.ring span{display:grid;place-items:center;width:100%;height:100%;border:2px solid var(--bg);border-radius:50%;background:#29232b;font-size:24px}.card{background:var(--panel);border:1px solid #303039;border-radius:16px;overflow:hidden;margin-bottom:16px}.user{display:flex;align-items:center;gap:10px;padding:12px}.postart{min-height:230px;display:grid;place-items:center;text-align:center;font-size:75px;background:radial-gradient(ellipse at 50% 70%,#632720,#281a25 48%,#15151b 80%)}.postart.purple{background:radial-gradient(ellipse at 50% 70%,#56347a,#211c35 50%,#15151b 80%)}.postart.green{background:radial-gradient(ellipse at 50% 70%,#285b46,#1b302b 50%,#15151b 80%)}.postactions{display:flex;gap:16px;padding:12px 13px 4px}.postactions button{border:0;background:none;padding:0;font-size:22px}.caption{padding:6px 13px 14px;font-size:13px}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#151519f5;border-top:1px solid var(--line);z-index:3;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:#aaaab5;padding:10px 2px 9px;display:grid;gap:3px;justify-items:center;font-size:10px}.nav button span{font-size:21px}.nav button.active{color:#ff814b}.field{width:100%;background:#202027;border:1px solid #41414a;border-radius:11px;color:white;padding:12px;margin:7px 0 12px}.profilecard,.person{background:var(--panel);border:1px solid #33333b;border-radius:15px;padding:14px;margin:12px 0}.person{display:flex;align-items:center;gap:10px}.person .grow{flex:1}.stats{display:flex;justify-content:space-around;border-block:1px solid var(--line);padding:14px 0;margin:15px 0}.stats b{display:block;font-size:19px;text-align:center}.stats small{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid div{aspect-ratio:1;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,#382329,#7a332a)}.grid div:nth-child(3n+2){background:linear-gradient(135deg,#322541,#67418c)}.grid div:nth-child(3n){background:linear-gradient(135deg,#1b3930,#39654a)}.story{min-height:290px;border-radius:16px;background:radial-gradient(ellipse at 50% 40%,#a83b24,#3c1927 60%,#17171e);display:grid;place-content:center;text-align:center;padding:20px;font-size:58px;margin:12px 0}.story p{font-size:15px}.empty{text-align:center;padding:30px 10px;color:#bbb}.empty b{display:block;font-size:36px}.note{padding:11px;background:#23232b;border-radius:10px;color:#c7c7d0;font-size:12px;line-height:1.6;margin:12px 0}.message{background:#292931;border-radius:14px;padding:11px 13px;margin:10px 0;font-size:13px;max-width:85%;overflow-wrap:anywhere}.message.mine{margin-left:auto;background:#783121}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(440px,100%);background:#202027;border:1px solid #44444d;border-radius:17px;padding:18px;max-height:90dvh;overflow:auto}.modal h2{margin:0;font-size:20px}.toast{color:#ffba8d;font-size:12px;min-height:18px;margin-top:8px}.footer{font-size:11px;color:#8c8c97;text-align:center;padding:14px}@media(min-width:600px){.content{padding:22px 26px}.postart{min-height:300px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="wolfmark" aria-hidden="true">🐺</div><div>FIRE <span style="color:var(--orange)">WOLF</span><div class="tagline">FIND YOUR PACK</div></div></div><button class="btn" data-tab="inbox" aria-label="Messages">✉ Messages</button></header>
<main class="content" id="screen"></main>
<nav class="nav" aria-label="Main navigation"><button class="active" data-tab="home"><span>⌂</span>Home</button><button data-tab="explore"><span>⌕</span>Explore</button><button data-tab="create"><span>⊕</span>Create</button><button data-tab="dream"><span>◉</span>Dream</button><button data-tab="profile"><span>♙</span>Profile</button></nav>
<div class="footer">Fire Wolf prototype · Demo content only · Not connected to a real social network</div></div><div id="overlay"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const people={me:{name:"Fire Wolf User",handle:"firewolf_user",emoji:"🐺",bio:"Find your pack. Chase your dreams."},luna:{name:"Luna",handle:"luna.wolf",emoji:"🌙",bio:"Dreamer · Night sky lover"},blaze:{name:"Blaze",handle:"blaze_07",emoji:"🔥",bio:"Creator · Live with fire"},sky:{name:"Sky",handle:"sky.chaser",emoji:"🌈",bio:"Collecting little moments"},green:{name:"Green Soul",handle:"green.soul",emoji:"🌿",bio:"Nature lover · Grow at your pace"}};
const seed={posts:[{id:1,user:"luna",emoji:"🌅",caption:"Every sunrise is another chance to shine. 🧡",likes:128,type:""},{id:2,user:"blaze",emoji:"🏔️",caption:"Lost in the moment, found in the wild.",likes:86,type:"purple"},{id:3,user:"green",emoji:"🌿",caption:"Protect your peace. Grow at your own pace.",likes:54,type:"green"}],dreams:[{user:"luna",emoji:"🌙",text:"Chase your dreams ✨",time:Date.now()},{user:"blaze",emoji:"🔥",text:"Good vibes only",time:Date.now()},{user:"sky",emoji:"🌈",text:"A new beginning",time:Date.now()}],dues:[],likes:[],saved:[],comments:{},chats:{},profileBio:people.me.bio};
let state;try{state=JSON.parse(localStorage.getItem("firewolf-v1"))||{}}catch(e){state={}}
let data={...seed,...state};let me="me",tab="home",viewProfile="me",chatWith=null,search="",toast="";
function persist(){try{localStorage.setItem("firewolf-v1",JSON.stringify(data))}catch(e){}}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function person(id){return people[id]||{name:id,handle:id,emoji:"🐺",bio:"Fire Wolf member"}}
function pair(a,b){return [a,b].sort().join("|")}
function mutual(a,b){return data.dues.includes(a+">"+b)&&data.dues.includes(b+">"+a)}
function toggleDue(id){if(id===me)return;if(!data.dues.includes(me+">"+id))data.dues.push(me+">"+id);if(mutual(me,id)){if(!data.chats[pair(me,id)])data.chats[pair(me,id)]=[];toast="🔥 You're now Due connections with "+person(id).name+"!";}else toast="Due sent! You'll connect when they Due you back.";persist();render()}
function dueBtn(id){return mutual(me,id)?'<button class="btn connected" disabled>✓ Due connected</button>':data.dues.includes(me+">"+id)?'<button class="btn" disabled>✓ Due sent</button>':`<button class="duebtn" data-due="${safe(id)}">＋ Due</button>`}
function personRow(id){let p=person(id);return `<div class="person"><div class="avatar">${p.emoji}</div><div class="grow"><b>${safe(p.name)}</b><div class="muted">@${safe(p.handle)}</div><div class="muted">${safe(p.bio)}</div></div>${dueBtn(id)}<button class="btn" data-profile="${safe(id)}">View</button></div>`}
function postCard(p){let u=person(p.user),liked=data.likes.includes(me+":"+p.id);return `<article class="card"><div class="user"><div class="avatar">${u.emoji}</div><div class="grow"><b>${safe(u.handle)}</b><div class="muted">Suggested for your pack · Demo post</div></div><button class="btn" data-profile="${safe(p.user)}">•••</button></div><div class="postart ${p.type||""}">${safe(p.emoji)}</div><div class="postactions"><button aria-label="Like" data-like="${p.id}">${liked?"❤️":"♡"}</button><button aria-label="Comment" data-comment="${p.id}">♧</button><button aria-label="Share" data-share="${p.id}">↗</button><span class="grow"></span><button aria-label="Save" data-save="${p.id}">${data.saved.includes(me+":"+p.id)?"🔖":"♧"}</button></div><div class="caption"><b>${(p.likes||0)+(liked?1:0)} likes</b><br><b>${safe(u.handle)}</b> ${safe(p.caption)}<div class="muted" style="margin-top:6px">${(data.comments[p.id]||[]).length} comments · <button class="btn" data-comment="${p.id}" style="padding:3px 7px;font-size:11px">Add comment</button></div>${(data.comments[p.id]||[]).map(c=>`<div style="margin-top:6px"><b>${safe(c.user)}</b> ${safe(c.text)}</div>`).join("")}</div></article>`}
function render(){ $$(".nav [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let s=$("#screen");
if(tab==="home")s.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="title">Your pack 🔥</div><div class="muted">A little fire in your feed.</div></div><span class="pill">DEMO MODE</span></div><div class="section">Dreams <span class="muted">· moments</span></div><div class="dreams"><button class="dream" data-action="newdream"><div class="ring" style="background:#41414a"><span>＋</span></div>Your Dream</button>${data.dreams.filter(d=>Date.now()-d.time<86400000).map((d,i)=>`<button class="dream" data-dream="${i}"><div class="ring"><span>${safe(d.emoji)}</span></div>${safe(person(d.user).name)}</button>`).join("")}</div><div class="row" style="justify-content:space-between"><div class="section">For you</div><button class="btn" data-tab="explore">Discover people</button></div>${data.posts.map(postCard).join("")}`;
if(tab==="explore")s.innerHTML=`<div class="title">Explore 🔥</div><p class="muted">Find people. Grow your pack.</p><button class="primary" data-tab="duetest" style="width:100%;margin:8px 0 14px">🧪 Open two-user Due test</button><div class="note">Test the full rule: both demo profiles must tap Due before chat unlocks.</div><label class="muted" for="account">Demo account switcher (for testing mutual Due)</label><select class="field" id="account">${Object.keys(people).map(id=>`<option value="${id}" ${id===me?'selected':''}>${person(id).emoji} ${safe(person(id).name)} (@${safe(person(id).handle)})</option>`).join("")}</select><input class="field" id="search" placeholder="Search people..." value="${safe(search)}">${Object.keys(people).filter(id=>id!==me&&(person(id).name+" "+person(id).handle).toLowerCase().includes(search.toLowerCase())).map(personRow).join("")||'<div class="empty">No members found.</div>'}`;
if(tab==="duetest"){const a="me",b="luna",other=me===a?b:a;const connected=mutual(a,b);const statusA=data.dues.includes(a+">"+b),statusB=data.dues.includes(b+">"+a);s.innerHTML=`<div class="title">Mutual Due test 🧪</div><p class="muted">Simulate two people using one phone. Changes are saved only in this browser.</p><div class="note"><b>Test rule:</b> one Due is only an invitation. Chat unlocks only after both profiles tap Due on each other.</div><label class="muted" for="testaccount">Currently acting as</label><select class="field" id="account"><option value="me" ${me===a?'selected':''}>🐺 Person A — Fire Wolf User</option><option value="luna" ${me===b?'selected':''}>🌙 Person B — Luna</option></select><div class="profilecard"><div class="row"><div class="avatar">🐺</div><div class="grow"><b>Person A · Fire Wolf User</b><div class="muted">@firewolf_user</div><div class="muted">${statusA?'Due sent to Person B':'Has not sent Due to Person B'}</div></div>${me===a?'<span class="pill">Acting now</span>':''}</div></div><div class="profilecard"><div class="row"><div class="avatar">🌙</div><div class="grow"><b>Person B · Luna</b><div class="muted">@luna.wolf</div><div class="muted">${statusB?'Due sent to Person A':'Has not sent Due to Person A'}</div></div>${me===b?'<span class="pill">Acting now</span>':''}</div></div><div class="section">Action for ${me===a?'Person A':'Person B'}</div>${dueBtn(other)} <span class="muted">${me===a?'Tap to Due Luna':'Tap to Due Fire Wolf User'}</span><div class="profilecard" style="margin-top:16px"><div class="row"><div style="font-size:28px">${connected?'🎉':'🔒'}</div><div class="grow"><b>${connected?'Mutual Due confirmed!':'Waiting for mutual Due'}</b><div class="muted">${connected?'Both people have tapped Due. Chat should be available.':'Chat stays locked until both people tap Due.'}</div></div></div>${connected?'<button class="primary" data-chat="'+other+'" style="width:100%;margin-top:12px">✉ Open demo chat</button>':'<button class="btn" disabled style="width:100%;margin-top:12px;opacity:.6">🔒 Chat locked — both must Due</button>'}</div><button class="btn" data-action="resetduetest" style="width:100%;margin-top:8px">↻ Reset test pair</button><p class="muted" style="margin-top:12px">Demo only: this uses one browser's local storage, not two real accounts or devices.</p>`}
if(tab==="create")s.innerHTML=`<div class="title">Create something 🔥</div><p class="muted">Let your world see what you're up to.</p><button class="btn" data-action="newpost" style="display:block;width:100%;text-align:left;padding:17px;margin:10px 0">📸 Create a post<div class="muted">Share photos, thoughts and updates</div></button><button class="btn" data-action="newdream" style="display:block;width:100%;text-align:left;padding:17px;margin:10px 0">◉ Create a Dream<div class="muted">Temporary story-style update</div></button><button class="btn" data-action="newshort" style="display:block;width:100%;text-align:left;padding:17px;margin:10px 0">▶ Create a Short<div class="muted">Share a short-form video caption</div></button><div class="note">Media uploads need a connected storage backend in the production app.</div>`;
if(tab==="dream")s.innerHTML=`<div class="title">Dream ◉</div><p class="muted">Moments that light up your world.</p><button class="primary" data-action="newdream" style="width:100%">＋ Share a Dream</button>${data.dreams.filter(d=>Date.now()-d.time<86400000).map(d=>`<div class="card" style="padding:13px;margin-top:14px"><div class="row"><div class="avatar">${safe(person(d.user).emoji)}</div><div class="grow"><b>${safe(person(d.user).name)}</b><div class="muted">Dream · temporary update</div></div><span class="pill">24h</span></div><div class="story">${safe(d.emoji)}<p>${safe(d.text)}</p></div></div>`).join("")}<div class="section">Shorts & videos</div><div class="card"><div class="postart purple">▶</div><div class="caption">Short-form videos will appear here. Video uploads require media storage.</div></div>`;
if(tab==="profile"){let p=person(viewProfile),own=viewProfile==="me",mine=data.posts.filter(x=>x.user===viewProfile);s.innerHTML=`<div style="text-align:center;padding:16px 0"><div class="avatar" style="width:88px;height:88px;font-size:42px;margin:0 auto 12px">${p.emoji}</div><div class="title">${safe(p.name)}</div><div class="muted">@${safe(p.handle)}</div><p>${safe(own?data.profileBio:p.bio)}</p>${own?'<button class="btn" data-action="editprofile">Edit profile</button> <button class="primary" data-action="newpost">＋ Post</button>':dueBtn(viewProfile)+(mutual(me,viewProfile)?' <button class="btn" data-chat="'+safe(viewProfile)+'">Message</button>':' <button class="btn" disabled title="Mutual Due required">🔒 Message</button>')}</div><div class="stats"><div><b>${mine.length}</b><small>Posts</small></div><div><b>${Object.keys(people).filter(id=>id!==viewProfile&&mutual(viewProfile,id)).length}</b><small>Due</small></div><div><b>${data.dreams.filter(d=>d.user===viewProfile).length}</b><small>Dreams</small></div></div><div class="section">Posts</div><div class="grid">${mine.map(p=>`<div>${safe(p.emoji)}</div>`).join("")||'<div style="grid-column:1/4;aspect-ratio:auto;padding:28px;font-size:12px">Your next post starts here.</div>'}</div>`;}
if(tab==="inbox")s.innerHTML=`<div class="title">Messages ✉</div><p class="muted">Private chats with your Due connections.</p>${Object.keys(people).filter(id=>id!==me&&mutual(me,id)).map(id=>`<button class="person" data-chat="${id}" style="width:100%;text-align:left"><div class="avatar">${person(id).emoji}</div><div class="grow"><b>${safe(person(id).name)}</b><div class="muted">${safe((data.chats[pair(me,id)]||[]).slice(-1)[0]?.text||"Start a conversation")}</div></div>›</button>`).join("")||'<div class="empty"><b>✉</b>Chat unlocks after mutual Due.<br>Connect with someone to start a conversation.</div>'}`;
if(tab==="chat"){let p=person(chatWith);let msgs=data.chats[pair(me,chatWith)]||[];s.innerHTML=`<button class="btn" data-action="inbox">← Messages</button><div class="row" style="margin:15px 0"><div class="avatar">${p.emoji}</div><div><b>${safe(p.name)}</b><div class="muted">Due connection · Demo chat</div></div></div><div id="messages" style="min-height:250px">${msgs.map(m=>`<div class="message ${m.from===me?"mine":""}">${safe(m.text)}<div class="muted">${m.from===me?"You":safe(p.name)}</div></div>`).join("")||'<div class="empty">Say hello to your pack! 👋</div>'}</div><form id="send" class="row"><input class="field" id="message" required placeholder="Write a message..." style="flex:1;margin:0"><button class="primary">Send</button></form><div class="note">Demo messages stay on this device. Real cross-device messaging requires the backend.</div>`}
if(toast){let t=toast;toast="";setTimeout(()=>{let el=$("#toast");if(el)el.textContent=t},0)}
}
function modal(title,fields,onSubmit,label="Save"){let ov=$("#overlay");ov.innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="btn" data-close>✕</button></div>${fields}<button class="primary" id="modal-submit" style="width:100%;margin-top:6px">${label}</button><div class="toast" id="toast" role="status"></div></div></div>`;$("#modalback").onclick=e=>{if(e.target.id==="modalback")ov.innerHTML=""};$("#modal-submit").onclick=onSubmit;let close=ov.querySelector("[data-close]");close.onclick=()=>ov.innerHTML=""}
function newPost(){modal("Create a post",'<label class="muted">Caption</label><textarea class="field" id="cap" rows="4" placeholder="What is on your mind?"></textarea><label class="muted">Mood</label><select class="field" id="mood"><option>🔥</option><option>🌅</option><option>🌿</option><option>🌌</option></select>',()=>{let cap=$("#cap").value.trim();if(!cap){$("#cap").focus();return}data.posts.unshift({id:Date.now(),user:me,emoji:$("#mood").value,caption:cap,likes:0,type:""});persist();$("#overlay").innerHTML="";tab="home";render()},"Publish demo post")}
function newDream(){modal("Share a Dream",'<label class="muted">Your moment</label><textarea class="field" id="dreamtext" rows="3" placeholder="What do you want to share?"></textarea><label class="muted">Dream vibe</label><select class="field" id="dreammood"><option>✨</option><option>🌙</option><option>🔥</option><option>🌈</option></select>',()=>{let text=$("#dreamtext").value.trim();if(!text){$("#dreamtext").focus();return}data.dreams.unshift({user:me,emoji:$("#dreammood").value,text,time:Date.now()});persist();$("#overlay").innerHTML="";tab="dream";render()},"Share Dream")}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.due){toggleDue(b.dataset.due);return}if(b.dataset.profile){viewProfile=b.dataset.profile;tab="profile";render();return}if(b.dataset.chat){if(!mutual(me,b.dataset.chat)){toast="Chat unlocks only after both people tap Due.";render();return}chatWith=b.dataset.chat;tab="chat";render();return}if(b.dataset.like){let k=me+":"+b.dataset.like;data.likes.includes(k)?data.likes=data.likes.filter(x=>x!==k):data.likes.push(k);persist();render();return}if(b.dataset.comment){let id=Number(b.dataset.comment);modal("Add a comment",'<textarea class="field" id="commenttext" placeholder="Write a kind comment..."></textarea>',()=>{let text=$("#commenttext").value.trim();if(text){data.comments[id]=data.comments[id]||[];data.comments[id].push({user:person(me).handle,text});persist();$("#overlay").innerHTML="";render()}}, "Post comment");return}if(b.dataset.save){let k=me+":"+b.dataset.save;data.saved.includes(k)?data.saved=data.saved.filter(x=>x!==k):data.saved.push(k);persist();render();return}if(b.dataset.share){modal("Share post",'<p class="muted">External sharing is not connected in this prototype. You can copy the post caption below.</p><textarea class="field" id="sharetext" readonly>'+safe(data.posts.find(p=>p.id===Number(b.dataset.share))?.caption||"Fire Wolf post")+'</textarea>',()=>{let t=$("#sharetext");t.select();try{document.execCommand("copy")}catch(e){}$("#overlay").innerHTML="";},"Copy caption");return}if(b.dataset.action==="newpost")newPost();if(b.dataset.action==="newdream")newDream();if(b.dataset.action==="newshort")modal("Create a Short",'<p class="muted">Video upload will be enabled when media storage is connected.</p><textarea class="field" id="shortcap" placeholder="Describe your short..."></textarea>',()=>{let t=$("#shortcap").value.trim();if(t){data.posts.unshift({id:Date.now(),user:me,emoji:"▶",caption:"Short: "+t,likes:0,type:"purple"});persist();$("#overlay").innerHTML="";tab="home";render()}},"Save demo short");if(b.dataset.action==="editprofile")modal("Edit profile",'<label class="muted">Bio</label><textarea class="field" id="bio">'+safe(data.profileBio)+'</textarea>',()=>{data.profileBio=$("#bio").value.trim();persist();$("#overlay").innerHTML="";render()},"Save bio");if(b.dataset.action==="resetduetest"){data.dues=data.dues.filter(x=>!(["me>luna","luna>me"].includes(x)));delete data.chats[pair("me","luna")];persist();toast="Test pair reset. Start with Person A.";me="me";tab="duetest";render();return}if(b.dataset.action==="inbox"){tab="inbox";render()}if(b.dataset.dream!==undefined){let d=data.dreams.filter(x=>Date.now()-x.time<86400000)[Number(b.dataset.dream)];if(d)modal(safe(person(d.user).name)+"'s Dream",'<div class="story">'+safe(d.emoji)+'<p>'+safe(d.text)+'</p></div>',()=>$("#overlay").innerHTML="","Close")}});
document.addEventListener("input",e=>{if(e.target.id==="search"){let pos=e.target.selectionStart;search=e.target.value;render();let i=$("#search");if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="account"){me=e.target.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id==="send"){e.preventDefault();if(!mutual(me,chatWith)){tab="inbox";render();return}let input=$("#message"),text=input.value.trim();if(!text)return;data.chats[pair(me,chatWith)]=data.chats[pair(me,chatWith)]||[];data.chats[pair(me,chatWith)].push({from:me,text,time:Date.now()});persist();render();$("#messages")?.scrollIntoView({block:"end"})}});
render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body></html>
